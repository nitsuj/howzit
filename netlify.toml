[functions]
  directory = "netlify/functions"

# Netlify serves the public Google Sheet tabs through same-origin proxy routes.
# The live page currently requests /data/*.csv, so those paths are forced to
# Google instead of the stale CSV files committed for the old GitHub Pages setup.

[[redirects]]
  from = "/data/taplist.csv"
  to = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEukzGVD6WDGAlK8qHFchTCs9oMs9LKbwkXRSzJBDa_vjMCxLWJhPKJvNTbQakGVPn9uZO5_Zi4wpd/pub?gid=0&single=true&output=csv"
  status = 200
  force = true

[[redirects]]
  from = "/data/hero.csv"
  to = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEukzGVD6WDGAlK8qHFchTCs9oMs9LKbwkXRSzJBDa_vjMCxLWJhPKJvNTbQakGVPn9uZO5_Zi4wpd/pub?gid=1406518917&single=true&output=csv"
  status = 200
  force = true

# Keep the original proxy paths available too.
[[redirects]]
  from = "/sheet/taplist.csv"
  to = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEukzGVD6WDGAlK8qHFchTCs9oMs9LKbwkXRSzJBDa_vjMCxLWJhPKJvNTbQakGVPn9uZO5_Zi4wpd/pub?gid=0&single=true&output=csv"
  status = 200
  force = true

[[redirects]]
  from = "/sheet/hero.csv"
  to = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEukzGVD6WDGAlK8qHFchTCs9oMs9LKbwkXRSzJBDa_vjMCxLWJhPKJvNTbQakGVPn9uZO5_Zi4wpd/pub?gid=1406518917&single=true&output=csv"
  status = 200
  force = true

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/sheet/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
