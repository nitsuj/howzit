[build]
  command = "node scripts/inject-events.js"
  publish = "."

[functions]
  directory = "netlify/functions"

# Netlify serves the public Google Sheet tabs through same-origin proxy routes.
# Taplist goes through a tiny function so team-facing column names can be forgiving.

[[redirects]]
  from = "/data/taplist.csv"
  to = "/.netlify/functions/taplist"
  status = 200
  force = true

[[redirects]]
  from = "/data/hero.csv"
  to = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEukzGVD6WDGAlK8qHFchTCs9oMs9LKbwkXRSzJBDa_vjMCxLWJhPKJvNTbQakGVPn9uZO5_Zi4wpd/pub?gid=1406518917&single=true&output=csv"
  status = 200
  force = true

[[redirects]]
  from = "/data/events.csv"
  to = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEukzGVD6WDGAlK8qHFchTCs9oMs9LKbwkXRSzJBDa_vjMCxLWJhPKJvNTbQakGVPn9uZO5_Zi4wpd/pub?gid=327976611&single=true&output=csv"
  status = 200
  force = true

[[redirects]]
  from = "/sheet/taplist.csv"
  to = "/.netlify/functions/taplist"
  status = 200
  force = true

[[redirects]]
  from = "/sheet/hero.csv"
  to = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEukzGVD6WDGAlK8qHFchTCs9oMs9LKbwkXRSzJBDa_vjMCxLWJhPKJvNTbQakGVPn9uZO5_Zi4wpd/pub?gid=1406518917&single=true&output=csv"
  status = 200
  force = true

[[redirects]]
  from = "/sheet/events.csv"
  to = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEukzGVD6WDGAlK8qHFchTCs9oMs9LKbwkXRSzJBDa_vjMCxLWJhPKJvNTbQakGVPn9uZO5_Zi4wpd/pub?gid=327976611&single=true&output=csv"
  status = 200
  force = true

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/sheet/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
